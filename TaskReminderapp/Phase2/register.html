<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

<div class="container">

    <h1>Register</h1>

    <input
    type="text"
    id="name"
    placeholder="Full Name"
    required
    >

    <input
        type="email"
        id="email"
        placeholder="Email"
    >

    <input
        type="password"
        id="password"
        placeholder="Password"
    >

    <input
    type="tel"
    id="phone"
    placeholder="Phone Number"
    >

    <button id="registerBtn">
        Register
    </button>

    <p>
        Already have an account?
        <a href="login.html">
            Login
        </a>
    </p>

</div>

<script type="module" src="./js/register.js"></script>

</body>
</html>
