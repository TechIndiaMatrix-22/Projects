<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Dashboard</title>

    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

    <div class="container">

        <h1>Task Reminder Dashboard</h1>

        <!-- User Information -->

        <div class="auth-section">

            <h2>User Credentials</h2>

            <p id="userInfo">
                Loading...
            </p>

            <button id="logoutBtn">
                Logout
            </button>

        </div>

        <hr>

        <!-- Add Task Section -->

        <div class="task-section">

            <h2>Add New Task</h2>

            <input
                type="text"
                id="taskName"
                placeholder="Enter Task Name"
            >

            <label for="startTime">
                Start Time
            </label>

            <input
                type="datetime-local"
                id="startTime"
            >

            <label for="endTime">
                End Time
            </label>

            <input
                type="datetime-local"
                id="endTime"
            >

            <button id="addTaskBtn">
                Add Task
            </button>

        </div>

        <hr>

        <!-- Tasks List -->

        <div class="task-list-section">

            <h2>My Tasks</h2>

            <div id="taskList">

                <!-- Tasks will be loaded dynamically -->

            </div>

        </div>

    </div>

    <script type="module" src="./js/dashboard.js"></script>

</body>

</html>
