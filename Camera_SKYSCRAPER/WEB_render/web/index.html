<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08090c"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="SKYSCRAPER">
<link rel="apple-touch-icon" href="/static/images/skyscraper-icon-192.png"><title>SKYSCRAPER — Think beyond</title>
<link rel="manifest" href="/static/manifest.webmanifest"><link rel="icon" href="/static/images/skyscraper-icon-192.png">
<link rel="stylesheet" href="/static/css/style.css"></head>
<body class="auth-body"><main class="auth-shell">
<div class="brand"><img class="brand-logo" src="/static/images/skyscraper-logo.png" alt="SKYSCRAPER"></div>
<section class="auth-card"><div class="eyebrow">SECURE CAMERA PLATFORM</div><h1>Welcome back</h1>
<p class="muted">Sign in to your SKYSCRAPER system</p>
<div class="tabs"><button class="tab active" data-tab="login">LOGIN</button><button class="tab" data-tab="register">REGISTER</button></div>
<div id="login-panel"><div class="method-tabs"><button class="method active" data-method="password">PASSWORD</button><button class="method" data-method="msg91">SMS OTP</button></div>
<form id="password-form"><label>Username<input name="username" autocomplete="username" required minlength="3"></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button class="primary wide">SIGN IN →</button></form>
<section id="msg91-panel" class="hidden">
<label>Registered mobile number<input id="otp-phone" type="tel" inputmode="tel" placeholder="9876543210" autocomplete="tel" required></label>
<button type="button" id="otp-send" class="primary wide">GENERATE ACCESS CODE →</button>
<label>SMS verification code<input id="otp-code" inputmode="numeric" autocomplete="one-time-code" maxlength="9" placeholder="Enter OTP"></label>
<button type="button" id="otp-verify" class="primary wide" disabled>VERIFY & LOGIN →</button>
<button type="button" id="otp-resend" class="secondary wide hidden">RESEND OTP</button>
<div id="otp-widget-status" class="message" role="status"></div>
</section></div>
<form id="register-form" class="hidden">
<label>Create username<input name="username" required minlength="3"></label>
<label>Create password<input name="password" type="password" required minlength="10"></label>
<label>Country calling code<select name="country_code" required><option value="91" selected>India (+91)</option><option value="1">USA/Canada (+1)</option><option value="44">United Kingdom (+44)</option><option value="971">UAE (+971)</option><option value="61">Australia (+61)</option><option value="65">Singapore (+65)</option><option value="81">Japan (+81)</option><option value="49">Germany (+49)</option><option value="33">France (+33)</option><option value="86">China (+86)</option></select></label>
<label>Mobile number<input name="phone" type="tel" required autocomplete="tel"></label>
<button class="primary wide">CREATE ACCOUNT →</button></form>
<div id="auth-message" class="message" role="status"></div><div class="auth-foot">● LOCAL SYSTEM ACCESS · SECURE SESSION</div></section>
<footer>SKYSCRAPER · THINK BEYOND</footer></main><script>
window.MSG91_WIDGET_CONFIG = {{ msg91_widget_config | tojson }};
</script>
<script src="https://verify.msg91.com/otp-provider.js" async></script>
<script src="/static/js/auth.js?v=2"></script>
<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("/sw.js", {scope: "/"}).catch(()=>{});</script></body></html>
